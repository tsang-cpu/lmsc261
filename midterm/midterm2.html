<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);


 function drawSnowman(cx, cy, scale){
    const bigRadius = w * 0.3 * scale;
    const smallRadius = bigRadius / 2;
    const tinyRadius = smallRadius / 15;
    const bodyY = cy + h * 0.15 * scale;
    const headY = cy - h * 0.25 * scale;

    //big body
    ctx.beginPath();
    ctx.arc(cx, bodyY, bigRadius, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();

    //lower body
    ctx.beginPath();
    ctx.arc(cx, headY, smallRadius, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();

    // eyes
    ctx.beginPath();
    ctx.arc(cx - smallRadius * 0.35, headY - smallRadius * 0.2, tinyRadius, 0, Math.PI * 2);
    ctx.fillStyle = "black";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx + smallRadius * 0.35, headY - smallRadius * 0.2, tinyRadius, 0, Math.PI * 2);
    ctx.fillStyle = "black";
    ctx.fill();
    //mouth
    ctx.beginPath();
    ctx.arc(cx, headY + smallRadius * 0.15, tinyRadius * 3, 0, Math.PI);
    ctx.strokeStyle = "black";
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.stroke();
 }
 const snowmanScale = 0.5;
 const bigRadius = w * 0.3 * snowmanScale;
 const smallRadius = bigRadius / 2;

 let velX = 1;
 let velY = 1;

    let manX = w / 2;
    let manY = h / 2;
    function drawBG(){
        ctx.clearRect(0, 0, w, h)
        ctx.fillStyle = "pink";
        ctx.fillRect(0, 0, w, h);
        drawSnowman(manX, manY, snowmanScale);
    }
    drawBG();

function tick(){
        manX += velX;

        if (manX <= 0 || manX >= w){ 
                velX *= -1; 
        } 

        
        manY += velY 
        if (manY <= 0 || manY >= h) {
                velY *= -1; 
        } 
        drawBG();
        requestAnimationFrame(tick);
}
tick();


    



</script>
